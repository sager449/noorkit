<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>نور كيت — NoorKit</title>
    <meta name="description" content="استوديو تصميم الآيات القرآنية." />
    <link rel="canonical" href="https://noorkit.vercel.app/" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/home.css" />
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#f5f5f5" />
  </head>
  <body class="home-body">
    <div class="grain" aria-hidden="true"></div>

    <header class="app-header">
      <a class="brand" href="index.html">
        <span class="brand-mark">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2L2 7l10 5 10-5-10-5z"></path>
            <path d="M2 17l10 5 10-5"></path>
            <path d="M2 12l10 5 10-5"></path>
          </svg>
        </span>
        <span>Noor<span class="brand-kit">Kit</span></span>
      </a>
      <button class="header-btn" id="settings-btn" aria-label="الإعدادات">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </button>
    </header>

    <main class="home-main">
      <div class="projects-grid" id="projects-grid"></div>

      <a class="floating-btn" href="editor.html" aria-label="مشروع جديد">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
      </a>
    </main>

    <script src="js/db.js"></script>
    <script>
      async function loadProjects() {
        const grid = document.getElementById("projects-grid");
        if (!grid || typeof NoorDB === "undefined") return;

        try {
          const projects = await NoorDB.getAll();
          if (!projects || projects.length === 0) {
            grid.innerHTML = "";
            return;
          }

          grid.innerHTML = projects.map((p) => {
            const design = p.design || {};
            const title = design.title || "تصميم بدون عنوان";
            const date = new Date(p.updatedAt).toLocaleDateString("ar-EG");
            const bg = design.background || {};
            let thumbStyle = "background:#f5ede0;width:100%;height:100%;";

            if (bg.type === "solid" && bg.value) {
              thumbStyle = `background:${bg.value};width:100%;height:100%;`;
            } else if (bg.type === "gradient" && bg.value) {
              thumbStyle = `background:${bg.value};width:100%;height:100%;`;
            } else if (bg.type === "image" && bg.imageUrl) {
              thumbStyle = `background-image:url('${bg.imageUrl}');background-size:cover;background-position:center;width:100%;height:100%;`;
            }

            return `
              <a class="project-card" href="editor.html?id=${p.id}">
                <div class="project-thumb">
                  <div style="${thumbStyle}"></div>
                </div>
                <div class="project-info">
                  <div class="project-name">${title}</div>
                  <div class="project-date">${date}</div>
                </div>
              </a>
            `;
          }).join("");
        } catch (err) {
          console.error("loadProjects failed:", err);
        }
      }

      document.addEventListener("DOMContentLoaded", loadProjects);
      window.addEventListener("focus", loadProjects);
      window.addEventListener("pageshow", loadProjects);
    </script>
  </body>
</html>
