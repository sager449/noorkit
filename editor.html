<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>المحرر — نور كيت</title>
    <meta name="description" content="صمم آية قرآنية بخطوط عربية جميلة وخلفيات طبيعية." />
    <link rel="canonical" href="https://noorkit.vercel.app/editor.html" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Amiri:wght@400;700&family=Tajawal:wght@400;500;700;900&family=Reem+Kufi:wght@400;500;600;700&family=Scheherazade+New:wght@400;700&family=Lateef&family=Aref+Ruqaa:wght@400;700&family=Noto+Naskh+Arabic:wght@400;700&family=Noto+Kufi+Arabic:wght@400;700&family=El+Messiri:wght@400;700&family=Almarai:wght@400;700;800&family=Harmattan:wght@400;700&family=Mirza:wght@400;700&family=Markazi+Text:wght@400;700&family=Vazirmatn:wght@400;700&family=Changa:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;700&family=Noto+Sans+Arabic:wght@400;700&family=Readex+Pro:wght@400;700&family=Qahiri&display=swap" rel="stylesheet" />

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@jaames/iro@5/dist/iro.min.css" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/editor.css" />
    <link rel="stylesheet" href="css/text-styles.css" />
    <link rel="stylesheet" href="css/editor-toolbar.css" />
  </head>
  <body class="editor-body">
    <header class="editor-header">
      <div class="header-left">
        <a class="icon-btn" href="index.html" aria-label="رجوع">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
          </svg>
        </a>
        <input type="text" class="design-title-input" id="design-title" value="تصميم بدون عنوان" />
      </div>

      <div class="header-center">
        <button class="icon-btn" id="undo-btn" aria-label="تراجع" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="9 14 4 9 9 4"></polyline>
            <path d="M20 20v-7a4 4 0 0 0-4-4H4"></path>
          </svg>
        </button>
        <button class="icon-btn" id="redo-btn" aria-label="إعادة" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 14 20 9 15 4"></polyline>
            <path d="M4 20v-7a4 4 0 0 1 4-4h12"></path>
          </svg>
        </button>
      </div>

      <div class="header-right">
        <button class="icon-btn" id="size-btn" aria-label="الحجم">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2"></rect>
            <line x1="9" y1="3" x2="9" y2="21"></line>
            <line x1="3" y1="9" x2="21" y2="9"></line>
          </svg>
        </button>
        <button class="btn-save" id="save-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
            <polyline points="17 21 17 13 7 13 7 21"></polyline>
            <polyline points="7 3 7 8 15 8"></polyline>
          </svg>
          <span>حفظ</span>
        </button>
        <button class="btn-export" id="export-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
          <span>تصدير</span>
        </button>
      </div>
    </header>

    <main class="editor-main">
      <div class="canvas-wrapper" id="canvas-wrapper">
        <div class="canvas-stage" id="canvas-stage">
          <canvas id="main-canvas"></canvas>
          <div class="text-overlay" id="text-overlay"></div>
        </div>
      </div>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="js/debug.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@jaames/iro@5"></script>
    <script src="js/db.js"></script>
    <script src="js/quran-api.js"></script>
    <script src="js/backgrounds.js"></script>
    <script src="js/fonts.js"></script>
    <script src="js/design-state.js"></script>
    <script src="js/canvas-renderer.js"></script>
    <script src="js/tools/registry.js"></script>
    <script src="js/tools/eraser.js"></script>
    <script src="js/tools/editor.js"></script>
    <script src="js/tools/font.js"></script>
    <script src="js/tools/color.js"></script>
    <script src="js/tools/background.js"></script>
    <script src="js/tools/frame.js"></script>
    <script src="js/tools/decor.js"></script>
    <script src="js/tools/translation.js"></script>
    <script src="js/tools/image.js"></script>
    <script src="js/tools/ayah.js"></script>
    <script src="js/tools/text-editor.js"></script>
    <script src="js/tools/selection/box.js"></script>

    <script src="js/tools/text-styles/registry.js"></script>
    <script src="js/tools/text-styles/shadow.js"></script>
    <script src="js/tools/text-styles/outline.js"></script>
    <script src="js/tools/text-styles/gradient.js"></script>
    <script src="js/tools/text-styles/glow.js"></script>
    <script src="js/tools/text-styles/opacity.js"></script>
    <script src="js/tools/text-styles/highlight.js"></script>
    <script src="js/tools/text-styles/line-height.js"></script>
    <script src="js/tools/text-styles/presets.js"></script>
    <script src="js/tools/text-styles/panel.js"></script>

    <script src="js/editor-toolbar.js"></script>

    <script src="js/editor-panels.js"></script>
    <script src="js/editor.js"></script>
  </body>
          </html>
