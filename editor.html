<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>المحرر — نور كيت</title>
    <meta name="description" content="صمم آية قرآنية بخطوط عربية جميلة وخلفيات طبيعية." />
    <link rel="canonical" href="https://noorkit.vercel.app/editor.html" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Amiri:wght@400;700&family=Tajawal:wght@400;500;700;900&family=Reem+Kufi:wght@400;500;600;700&family=Scheherazade+New:wght@400;700&family=Lateef&family=Aref+Ruqaa:wght@400;700&family=Noto+Naskh+Arabic:wght@400;700&family=Noto+Kufi+Arabic:wght@400;700&family=El+Messiri:wght@400;700&family=Almarai:wght@400;700;800&family=Harmattan:wght@400;700&family=Mirza:wght@400;700&family=Markazi+Text:wght@400;700&family=Vazirmatn:wght@400;700&family=Changa:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;700&family=Noto+Sans+Arabic:wght@400;700&family=Readex+Pro:wght@400;700&family=Qahiri&display=swap" rel="stylesheet" />

    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/editor.css" />
  </head>
  <body class="editor-body">
    <header class="editor-header">
      <div class="header-left">
        <a class="icon-btn" href="index.html" aria-label="رجوع">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
          </svg>
        </a>
        <input type="text" class="design-title-input" id="design-title" value="تصميم بدون عنوان" />
      </div>

      <div class="header-center">
        <button class="icon-btn" id="undo-btn" aria-label="تراجع" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="9 14 4 9 9 4"></polyline>
            <path d="M20 20v-7a4 4 0 0 0-4-4H4"></path>
          </svg>
        </button>
        <button class="icon-btn" id="redo-btn" aria-label="إعادة" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 14 20 9 15 4"></polyline>
            <path d="M4 20v-7a4 4 0 0 1 4-4h12"></path>
          </svg>
        </button>
      </div>

      <div class="header-right">
        <button class="icon-btn" id="size-btn" aria-label="الحجم">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2"></rect>
            <line x1="9" y1="3" x2="9" y2="21"></line>
            <line x1="3" y1="9" x2="21" y2="9"></line>
          </svg>
        </button>
        <button class="btn-save" id="save-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
            <polyline points="17 21 17 13 7 13 7 21"></polyline>
            <polyline points="7 3 7 8 15 8"></polyline>
          </svg>
          <span>حفظ</span>
        </button>
        <button class="btn-export" id="export-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
          <span>تصدير</span>
        </button>
      </div>
    </header>

    <main class="editor-main">
      <div class="canvas-wrapper" id="canvas-wrapper">
        <div class="canvas-stage" id="canvas-stage">
          <canvas id="main-canvas"></canvas>
        </div>
      </div>
    </main>

    <nav class="editor-toolbar" id="editor-toolbar" style="display:flex !important; visibility:visible !important; position:fixed !important; bottom:0 !important; left:0 !important; right:0 !important; z-index:9999 !important; background:#fff !important; min-height:70px !important; padding:8px !important;">
      <button class="tool-btn" data-tool="ayah">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
          <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
        </svg>
        <span>الآية</span>
      </button>
      <button class="tool-btn" data-tool="element-editor">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
    <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
  </svg>
  <span>تحرير</span>
      </button>

      <button class="tool-btn" data-tool="image">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="2"></rect>
          <circle cx="8.5" cy="8.5" r="1.5"></circle>
          <polyline points="21 15 16 10 5 21"></polyline>
        </svg>
        <span>صورة</span>
      </button>

      <button class="tool-btn" data-tool="font">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="4 7 4 4 20 4 20 7"></polyline>
          <line x1="9" y1="20" x2="15" y2="20"></line>
          <line x1="12" y1="4" x2="12" y2="20"></line>
        </svg>
        <span>الخط</span>
      </button>

      <button class="tool-btn" data-tool="text-color">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 19l7-7 3 3-7 7-3-3z"></path>
          <path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"></path>
        </svg>
        <span>اللون</span>
      </button>

      <button class="tool-btn" data-tool="background">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="2"></rect>
          <circle cx="8.5" cy="8.5" r="1.5"></circle>
          <polyline points="21 15 16 10 5 21"></polyline>
        </svg>
        <span>الخلفية</span>
      </button>

      <button class="tool-btn" data-tool="frame">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="2"></rect>
          <rect x="7" y="7" width="10" height="10" rx="1"></rect>
        </svg>
        <span>الإطار</span>
      </button>

      <button class="tool-btn" data-tool="translation">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="2" y1="12" x2="22" y2="12"></line>
          <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
        </svg>
        <span>الترجمة</span>
      </button>

      <button class="tool-btn" data-tool="decor">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2L15.09 8.26 22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"></path>
        </svg>
        <span>زخرفة</span>
      </button>

      <button class="tool-btn" data-tool="eraser">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 20H7L3 16a1 1 0 0 1 0-1.4L14.6 3a1 1 0 0 1 1.4 0L21 8a1 1 0 0 1 0 1.4L10.4 20"></path>
          <line x1="18" y1="13" x2="6" y2="13"></line>
        </svg>
        <span>مسح</span>
      </button>
    </nav>

    <div class="tool-panel" id="tool-panel" hidden>
      <button class="panel-close" id="panel-close" aria-label="إغلاق">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
      <div class="panel-content" id="panel-content"></div>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="js/db.js"></script>
    <script src="js/quran-api.js"></script>
    <script src="js/backgrounds.js"></script>
    <script src="js/fonts.js"></script>
    <script src="js/design-state.js"></script>
    <script src="js/canvas-renderer.js"></script>
    <script src="js/tools/registry.js"></script>
    <script src="js/tools/eraser.js"></script>
    <script src="js/tools/ayah-decorations.js"></script>
    <script src="js/tools/editor.js"></script>
    <script src="js/editor-panels.js"></script>
    <script src="js/editor.js"></script>
  </body>
  </html>
